    }

    async function saveBlob(id,file){var buf=await blobToArrayBuffer(file);var mime=file.type&&file.type!=='audio/mpeg'?file.type:getMimeFromName(file.name);try{await dbP(id,{buffer:buf,type:mime,name:file.name})}catch(e){showToast('存储失败','error')}fUrls[id]=URL.createObjectURL(new Blob([buf],{type:mime}))}

    function openM(id){editId=id||null;mT.childNodes[0].textContent=editId?'编辑音效':'添加音效';$('#mE').style.display=editId?'':'none';capKey=null;listening=false;heldMods={};loopEdit=false;holdEdit=false;selectedFile=null;selColor='';selectedCatId='';editDuration=null;stopEditPreview();stopRecIf();$('#tlG').style.display='none';tlBox.innerHTML='';tlInst=null;srcMode='file';document.querySelectorAll('.src-tab').forEach(function(b){b.classList.toggle('on',b.dataset.src==='file')});fileSec.style.display='block';recSec.style.display='none';hideFileSt();hideRecSt();recIndicator.classList.remove('show');recHint.textContent='点击开始录音';closeCsDD();updateCatSelect();if(editId){var p=pads.find(function(x){return x.id===editId});if(p){fN.value=p.name;capKey=p.shortcut||null;fS.value=p.start!=null?fT(p.start):'';fE.value=p.end!=null?fT(p.end):'';fV.value=p.volume!=null?p.volume:100;fVL.textContent=(p.volume!=null?p.volume:100)+'%';fSpd.value=Math.round((p.speed||1)*100);fSpdL.textContent=(p.speed||1).toFixed(1)+'x';loopEdit=!!p.loop;holdEdit=p.trigger==='hold';selColor=p.color||'';selectedCatId=p.categoryId||'';editDuration=p.duration||null;if(src(p)){showFileSt(p._cachedName||p.fileName||'已加载');loadTLAsync(p)}else hideFileSt()}}else{fN.value='';fS.value='';fE.value='';fV.value=100;fVL.textContent='100%';fSpd.value=100;fSpdL.textContent='1.0x';selectedCatId=(categoryFilter&&categoryFilter!=='__none')?categoryFilter:''}fF.value='';updateClrPreview();updateCatTrigger();rSK();updLoopUI();updHoldUI();syncSliders();scrollLock();modWrap.classList.add('open');setTimeout(function(){fN.focus()},250)}

    async function loadTLAsync(p){var cid=editId;$('#tlG').style.display='block';tlBox.innerHTML='<div class="wave-skeleton"></div>';var wv=waveCache[p.id];if(!wv){var blob=await loadBlob(p.id);if(blob){wv=await genWave(blob);if(wv)waveCache[p.id]=wv}}if(editId!==cid)return;if(wv){tlBox.innerHTML='';tlInst=createTL(tlBox,wv.dur,p.start||0,p.end||wv.dur,function(s,e){fS.value=fT(s);fE.value=fT(e)},wv.w)}else{tlBox.innerHTML='<div style="text-align:center;color:var(--t2);padding:16px;font-size:12px">无法加载</div>'}}

    $('#skC').addEventListener('click',function(){capKey=null;listening=false;heldMods={};rSK()});
    fS.addEventListener('input',function(){if(tlInst){var v=pT(fS.value);if(v!=null&&v<tlInst.dur)tlInst.setRange(v,tlInst.getEnd())}if(editPreview){var pv=pT(fS.value);if(pv!=null)editPreview.currentTime=pv}});
    fE.addEventListener('input',function(){if(tlInst){var v=pT(fE.value);if(v!=null&&v>0)tlInst.setRange(tlInst.getStart(),v)}});

    async function doSave(){if(saving)return;saving=true;var btn=$('#mS');btn.disabled=true;btn.textContent='保存中…';stopEditPreview();try{var name=fN.value.trim()||getDefaultName();var file=fF.files[0]||(selectedFile instanceof File?selectedFile:null);var start=pT(fS.value),end=pT(fE.value),volume=parseInt(fV.value)||100,loop=loopEdit,color=selColor,speed=fSpd.value/100,trigger=holdEdit?'hold':'tap',catId=selectedCatId||'';if(tlInst){if(start==null)start=tlInst.getStart();if(end==null)end=tlInst.getEnd()}if(editId){var p=pads.find(function(x){return x.id===editId});if(p){p.name=name;p.shortcut=capKey;p.start=start;p.end=end;p.volume=volume;p.loop=loop;p.color=color;p.speed=speed;p.trigger=trigger;p.categoryId=catId;if(file){p.fileName=file.name;p._cachedName=file.name;await saveBlob(p.id,file);p.duration=editDuration;if(auds[p.id]){destroyAudio(auds[p.id]);delete auds[p.id]}delete waveCache[p.id]}else if(editDuration)p.duration=editDuration}}else{var id=uid();var np={id:id,name:name,shortcut:capKey,start:start,end:end,volume:volume,loop:loop,color:color,fileName:file?file.name:null,speed:speed,trigger:trigger,categoryId:catId,duration:editDuration||null};if(file){np._cachedName=file.name;await saveBlob(id,file)}pads.push(np)}save();closeM();rPads();rList();await syncGlobalShortcuts()}catch(e){}finally{saving=false;btn.disabled=false;btn.textContent='保存'}}

    async function rmPad(id){if(auds[id]){destroyAudio(auds[id]);delete auds[id]}if(fUrls[id]){URL.revokeObjectURL(fUrls[id]);delete fUrls[id]}delete waveCache[id];try{await dbD(id)}catch(e){}pads=pads.filter(function(p){return p.id!==id});save();rPads();rList();await syncGlobalShortcuts()}
    $('#btnClear').addEventListener('click',async function(){if(!pads.length)return;if(!await themedConfirm('清空所有？'))return;auds={};Object.values(fUrls).forEach(function(u){URL.revokeObjectURL(u)});fUrls={};waveCache={};pads=[];save();rPads();rList();await syncGlobalShortcuts();closeD()});
    $('#stopBtn').addEventListener('click',stopAll);

    area.addEventListener('pointerdown',function(e){var btn=e.target.closest('.pb');if(!btn||btn.classList.contains('no-audio'))return;e.preventDefault();var id=btn.dataset.id;var p=pads.find(function(x){return x.id===id});var isHold=p&&p.trigger==='hold';iData={id:id,el:btn,sx:e.clientX,sy:e.clientY};if(isHold){iState='hold';playPad(id)}else{iState='wait';iTimer=setTimeout(function(){if(iState==='wait'){iState='preview';startPreview(iData.id)}},600)}});
    document.addEventListener('pointermove',function(e){if(iState==='idle'||!iData)return;var d=Math.hypot(e.clientX-iData.sx,e.clientY-iData.sy);if(iState==='hold'&&d>8){stopPad(iData.id);iState='drag';createGhost(iData.el,e.clientX,e.clientY)}if(iState==='wait'&&d>8){clearTimeout(iTimer);iState='drag';createGhost(iData.el,e.clientX,e.clientY)}if(iState==='preview'&&d>15){stopPreview();iState='drag';createGhost(iData.el,e.clientX,e.clientY)}if(iState==='drag')moveGhost(e.clientX,e.clientY)});
    document.addEventListener('pointerup',function(){clearTimeout(iTimer);if(iState==='hold'&&iData)stopPad(iData.id);else if(iState==='wait'&&iData){var now=Date.now();if(now-_lastPlay>200){_lastPlay=now;playPad(iData.id)}}else if(iState==='preview')stopPreview();else if(iState==='drag')removeGhost();iState='idle';iData=null});
    document.addEventListener('pointercancel',function(){clearTimeout(iTimer);if(iState==='hold'&&iData)stopPad(iData.id);if(iState==='preview')stopPreview();if(iState==='drag')removeGhost();iState='idle';iData=null});

    document.addEventListener('keydown',function(e){if(modWrap.classList.contains('open')&&listening){e.preventDefault();e.stopPropagation();if(e.key==='Escape'){listening=false;heldMods={};rSK();return}var modKeys=['Control','Alt','Shift','Meta'];if(modKeys.indexOf(e.key)!==-1){heldMods[e.key]=true;updateListeningDisplay();return}var parts=[];if(e.ctrlKey)parts.push('Ctrl');if(e.altKey)parts.push('Alt');if(e.shiftKey)parts.push('Shift');if(e.metaKey)parts.push('Meta');parts.push(normalizeKey(e.key));var combo=parts.join('+');var conflict=pads.find(function(p){return p.shortcut===combo&&p.id!==editId});if(conflict){listening=false;heldMods={};themedConfirm('快捷键 '+kl(combo)+' 被「'+conflict.name+'」使用，替换？').then(function(y){if(y){conflict.shortcut=null;capKey=combo;save();rList()}rSK()});return}capKey=combo;listening=false;heldMods={};rSK();return}if(modWrap.classList.contains('open')){if(e.key==='Enter')doSave();return}if(cpo.classList.contains('open'))return;var combo=buildComboFromEvent(e);if(combo){var p=pads.find(function(x){return x.shortcut===combo});if(p){e.preventDefault();playPad(p.id)}}if(e.key==='Escape')stopAll()});
    document.addEventListener('keyup',function(e){if(!listening)return;if(['Control','Alt','Shift','Meta'].indexOf(e.key)!==-1){delete heldMods[e.key];updateListeningDisplay()}});

    window.addEventListener('unhandledrejection',function(e){console.error(e.reason);showToast('操作异常','error')});

    async function init(){loadCats();categoryFilter=localStorage.getItem(CAT_FILTER_KEY)||'';if(categoryFilter&&categoryFilter!=='__none'&&!categories.some(function(c){return c.id===categoryFilter})){categoryFilter='';localStorage.setItem(CAT_FILTER_KEY,'')}await load();for(var i=0;i<pads.length;i++){var p=pads[i];try{var blob=await loadBlob(p.id);if(blob){fUrls[p.id]=URL.createObjectURL(blob);p._cachedName=p.fileName||'已加载';if(!p.duration)p.duration=await getDur(blob)}}catch(e){}}save();rPads();renderCatFilter();updateFilterLabel();renderDropdownTree();updateCatSelect();if(window.electronAPI){window.electronAPI.onTrigger(function(id){playPad(id)});await syncGlobalShortcuts()}}
    init();
  })();
